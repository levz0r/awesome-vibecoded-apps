name: Check links

on:
  pull_request:
    paths:
      - README.md
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --config lychee.toml README.md
          # Fail PRs that add a broken link; scheduled runs report via an issue instead.
          fail: ${{ github.event_name == 'pull_request' }}

      - name: Find open broken-links issue
        id: find
        if: github.event_name != 'pull_request' && steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --label broken-links --state open \
            --json number --jq '.[0].number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Open or update broken-links issue
        if: github.event_name != 'pull_request' && steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: Broken links
          content-filepath: ./lychee/out.md
          labels: broken-links
          issue-number: ${{ steps.find.outputs.number }}
