name: Inclusion criteria

on:
  pull_request:
    paths:
      - README.md

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # needs the base branch to find the added entries

      - name: Check new entries against the inclusion criteria
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Passed as data, never interpolated into the script.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 .github/scripts/check-entries.py "origin/${{ github.base_ref }}"
