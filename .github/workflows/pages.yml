name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - README.md
      - site/**
      - .github/workflows/pages.yml
  # Rebuild after the weekly link check so the "last checked" date and failing marks stay current.
  workflow_run:
    workflows: [Check links]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 site/build.py --out _site

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Render social preview images
        run: |
          fc-list | grep -q DejaVuSans-Bold || (sudo apt-get update -q && sudo apt-get install -y -q fonts-dejavu-core)
          python -m pip install --quiet pillow==12.3.0
          python site/og.py --out _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  indexnow:
    # Tell Bing, Yandex and other IndexNow engines the pages changed. Skipped for the
    # weekly link-check rebuild, which usually changes nothing but the check date.
    needs: deploy
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Submit URLs to IndexNow
        run: |
          python3 - <<'PY'
          import json, re, urllib.request
          src = open("site/build.py").read()
          key = re.search(r'INDEXNOW_KEY = "([0-9a-f]+)"', src).group(1)
          sitemap = urllib.request.urlopen("https://vibecodedapps.dev/sitemap.xml", timeout=30).read().decode()
          urls = re.findall(r"<loc>([^<]+)</loc>", sitemap)
          body = json.dumps({"host": "vibecodedapps.dev", "key": key,
                             "keyLocation": f"https://vibecodedapps.dev/{key}.txt", "urlList": urls}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body,
                                       headers={"Content-Type": "application/json; charset=utf-8"})
          with urllib.request.urlopen(req, timeout=30) as resp:
              print(f"IndexNow: HTTP {resp.status} for {len(urls)} URLs")
          PY
