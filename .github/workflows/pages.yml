name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - README.md
      - site/**
      - .github/workflows/pages.yml
  # Rebuild after the weekly link check so the "last checked" date and failing marks stay current.
  workflow_run:
    workflows: [Check links]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 site/build.py --out _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
